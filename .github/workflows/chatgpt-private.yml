name: Private ChatGPT command
run-name: ChatGPT ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      command:
        description: Shell command authorized by repository owner
        required: true
        type: string
      request_id:
        description: Correlation ID
        required: true
        type: string
      codespace:
        description: Optional Codespace name for remote execution
        required: false
        default: ''
        type: string
      registry:
        description: GitHub package registry authentication profile
        required: false
        default: none
        type: choice
        options: [none, npm, container, maven, nuget, rubygems]
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  packages: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Execute command
        shell: bash
        env:
          PRIVATE_COMMAND: ${{ inputs.command }}
          GH_TOKEN: ${{ secrets.CHATGPT_OWNER_TOKEN || github.token }}
          PRIVATE_CODESPACE: ${{ inputs.codespace }}
          PRIVATE_REGISTRY: ${{ inputs.registry }}
          PRIVATE_REGISTRY_USER: ${{ github.actor }}
        run: |
          gh auth setup-git
          registry_dir=$(mktemp -d)
          trap 'rm -rf "$registry_dir"' EXIT
          registry_user="$PRIVATE_REGISTRY_USER"
          case "$PRIVATE_REGISTRY" in
            npm)
              export NODE_AUTH_TOKEN="$GH_TOKEN"
              export NPM_CONFIG_USERCONFIG="$registry_dir/npmrc"
              printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
              chmod 600 "$NPM_CONFIG_USERCONFIG"
              ;;
            container)
              export DOCKER_CONFIG="$registry_dir/docker"
              printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$registry_user" --password-stdin
              ;;
            maven)
              printf '%s\n' "<settings><servers><server><id>github</id><username>$registry_user</username><password>\${env.GH_TOKEN}</password></server></servers></settings>" > "$registry_dir/settings.xml"
              export MAVEN_ARGS="-s $registry_dir/settings.xml"
              ;;
            nuget)
              export NuGetPackageSourceCredentials_github="Username=$registry_user;Password=$GH_TOKEN"
              dotnet nuget add source "https://nuget.pkg.github.com/$registry_user/index.json" --name github
              ;;
            rubygems)
              export GEM_HOST_API_KEY="Bearer $GH_TOKEN"
              ;;
          esac
          if [ -n "$PRIVATE_CODESPACE" ]; then
            gh codespace ssh -c "$PRIVATE_CODESPACE" -- bash -lc "$(printf '%q' "$PRIVATE_COMMAND")"
          else
            bash -eo pipefail -c "$PRIVATE_COMMAND"
          fi

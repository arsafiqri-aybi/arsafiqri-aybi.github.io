<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="ARS — frontend, motion, systems, and selected work.">
  <title>ARS — Portfolio</title>
  <style>
    :root{
      --bg:#08090b;
      --bg2:#0d0f12;
      --ink:#f2f2ee;
      --muted:rgba(242,242,238,.46);
      --faint:rgba(242,242,238,.14);
      --line:rgba(255,255,255,.10);
      --line2:rgba(255,255,255,.18);
      --accent:#d9ff72;
      --ease:cubic-bezier(.2,.8,.2,1);
      --ease2:cubic-bezier(.16,1,.3,1);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-width:280px;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    html{scroll-behavior:smooth}
    body{overflow:hidden}
    button,a{font:inherit;color:inherit}
    button{border:0}
    a{text-decoration:none}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    .background{
      position:fixed;inset:0;pointer-events:none;overflow:hidden;
      background:
        radial-gradient(70vw 70vw at 16% 24%,rgba(255,255,255,.045),transparent 60%),
        radial-gradient(55vw 55vw at 84% 74%,rgba(255,255,255,.025),transparent 62%),
        linear-gradient(145deg,#0c0e11 0%,#07080a 55%,#090a0d 100%);
    }
    .background::before{
      content:"";position:absolute;inset:0;opacity:.18;
      background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(circle at 50% 50%,#000,transparent 78%);
    }

    .topbar{
      position:fixed;z-index:30;top:0;left:0;right:0;
      display:flex;align-items:center;justify-content:space-between;
      padding:22px clamp(20px,3vw,44px);
      pointer-events:none;
    }
    .brand,.topbar__status{pointer-events:auto}
    .brand{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
    .brand__mark{
      width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
      background:var(--ink);color:#08090b;font-size:9px;font-weight:800;
    }
    .topbar__status{
      display:flex;align-items:center;gap:9px;
      font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.13em;color:rgba(255,255,255,.42);
    }
    .status-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgba(217,255,114,.45)}

    .selector{
      position:fixed;inset:0;z-index:10;
      display:grid;place-items:center;
      padding:76px clamp(18px,3.5vw,56px) 42px;
      transition:opacity .45s ease,transform .72s var(--ease2),filter .6s ease;
    }
    body.is-detail-open .selector{
      opacity:.16;transform:scale(.94);filter:blur(14px);pointer-events:none;
    }

    .shell{
      width:min(92vw,1500px);
      height:min(78svh,820px);
      min-height:540px;
      display:grid;
      grid-template-columns:minmax(0,1.88fr) minmax(300px,.72fr);
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.11);
      border-radius:34px;
      background:
        linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.014) 44%,rgba(255,255,255,.03)),
        rgba(12,14,18,.48);
      -webkit-backdrop-filter:blur(30px) saturate(118%);
      backdrop-filter:blur(30px) saturate(118%);
      box-shadow:0 48px 140px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.09);
    }
    .shell::after{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(115deg,rgba(255,255,255,.055),transparent 18% 74%,rgba(255,255,255,.018));
    }

    .preview{
      position:relative;min-width:0;overflow:hidden;cursor:pointer;
      display:flex;align-items:flex-end;
      padding:clamp(34px,4.4vw,72px);
      border-right:1px solid rgba(255,255,255,.07);
      isolation:isolate;
    }
    .preview::before{
      content:"";position:absolute;inset:0;z-index:-2;
      background:
        radial-gradient(70% 80% at 76% 22%,rgba(255,255,255,.065),transparent 60%),
        linear-gradient(155deg,rgba(255,255,255,.018),transparent 55%);
    }
    .preview__visual{
      position:absolute;inset:0;z-index:-1;overflow:hidden;
      transition:opacity .5s ease,transform .8s var(--ease2);
    }
    .preview__visual::before,.preview__visual::after{content:"";position:absolute;transition:all .9s var(--ease2)}
    .preview[data-index="0"] .preview__visual::before{
      width:min(42vw,620px);aspect-ratio:1;border-radius:50%;
      right:-10%;top:-18%;border:1px solid rgba(255,255,255,.13);
      box-shadow:0 0 0 52px rgba(255,255,255,.018),0 0 0 104px rgba(255,255,255,.009);
    }
    .preview[data-index="0"] .preview__visual::after{
      width:140px;height:1px;background:rgba(255,255,255,.18);right:12%;bottom:22%;
      transform:rotate(-28deg);
    }

    .preview[data-index="1"] .preview__visual::before{
      width:58%;height:58%;right:8%;top:12%;
      border:1px solid rgba(255,255,255,.12);
      transform:skewY(-8deg) rotate(-6deg);
      box-shadow:24px 26px 0 rgba(255,255,255,.018),48px 52px 0 rgba(255,255,255,.009);
    }
    .preview[data-index="1"] .preview__visual::after{
      width:34%;height:34%;right:20%;top:25%;
      background:linear-gradient(140deg,rgba(255,255,255,.11),rgba(255,255,255,.01));
      border-radius:50%;
      filter:blur(1px);
    }

    .preview[data-index="2"] .preview__visual::before{
      width:1px;height:60%;left:68%;top:10%;background:rgba(255,255,255,.14);
      box-shadow:-120px 30px 0 rgba(255,255,255,.09),120px -24px 0 rgba(255,255,255,.08);
      transform:rotate(24deg);
    }
    .preview[data-index="2"] .preview__visual::after{
      width:280px;height:280px;border-radius:50%;
      border:1px dashed rgba(255,255,255,.12);right:8%;bottom:2%;
    }

    .preview[data-index="3"] .preview__visual::before{
      width:52%;height:52%;right:7%;top:17%;
      background:
        linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
      background-size:32px 32px;
      transform:perspective(800px) rotateX(61deg) rotateZ(-18deg);
      opacity:.62;
    }
    .preview[data-index="3"] .preview__visual::after{
      width:9px;height:9px;border-radius:50%;background:var(--accent);right:24%;top:31%;
      box-shadow:0 0 32px rgba(217,255,114,.35);
    }

    .preview[data-index="4"] .preview__visual::before{
      width:42%;height:68%;right:9%;top:12%;
      border-left:1px solid rgba(255,255,255,.15);
      border-bottom:1px solid rgba(255,255,255,.08);
      transform:skewX(-8deg);
    }
    .preview[data-index="4"] .preview__visual::after{
      width:210px;height:210px;border-radius:50%;
      right:14%;top:20%;background:radial-gradient(circle at 40% 36%,rgba(255,255,255,.10),rgba(255,255,255,.012) 58%,transparent 62%);
      border:1px solid rgba(255,255,255,.08);
    }

    .preview[data-index="5"] .preview__visual::before{
      width:62%;height:1px;background:rgba(255,255,255,.14);right:4%;top:42%;
      box-shadow:0 84px 0 rgba(255,255,255,.08),0 168px 0 rgba(255,255,255,.045);
    }
    .preview[data-index="5"] .preview__visual::after{
      content:"↗";right:8%;bottom:8%;font-size:clamp(96px,14vw,220px);line-height:1;color:rgba(255,255,255,.045);
    }

    .preview__meta{
      position:absolute;top:clamp(28px,3.4vw,48px);left:clamp(34px,4.4vw,72px);right:clamp(34px,4.4vw,72px);
      display:flex;justify-content:space-between;gap:16px;
      font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.13em;color:rgba(255,255,255,.38);
      text-transform:uppercase;
    }
    .preview__copy{max-width:min(72%,820px)}
    .preview__eyebrow{
      margin:0 0 16px;
      font:650 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.14em;color:rgba(255,255,255,.42);text-transform:uppercase;
    }
    .preview__title{
      margin:0;font-weight:560;letter-spacing:-.065em;line-height:.88;
      font-size:clamp(54px,7.4vw,122px);
      text-wrap:balance;
      transition:opacity .25s ease,transform .5s var(--ease2);
    }
    .preview__title em{
      font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.055em;color:rgba(255,255,255,.77);
    }
    .preview__summary{
      max-width:56ch;margin:22px 0 0;
      font-size:clamp(13px,1.15vw,17px);line-height:1.55;color:rgba(255,255,255,.53);
      transition:opacity .25s ease,transform .5s var(--ease2);
    }
    .preview__open{
      position:absolute;right:clamp(30px,3.8vw,58px);bottom:clamp(30px,3.8vw,56px);
      display:flex;align-items:center;gap:11px;
      font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.42);
    }
    .preview__open i{
      width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.14);font-style:normal;font-size:14px;color:rgba(255,255,255,.7);
      transition:transform .35s var(--ease),background .35s ease;
    }
    .preview:hover .preview__open i{transform:translate(3px,-3px);background:rgba(255,255,255,.06)}

    .rail{
      position:relative;min-width:0;
      display:flex;align-items:center;justify-content:center;
      perspective:1200px;
      padding:40px 18px 40px 22px;
    }
    .rail::before,.rail::after{
      content:"";position:absolute;left:0;right:0;height:24%;
      z-index:4;pointer-events:none;
    }
    .rail::before{top:0;background:linear-gradient(#0d0f13 5%,rgba(13,15,19,.86),transparent)}
    .rail::after{bottom:0;background:linear-gradient(transparent,rgba(13,15,19,.86),#0d0f13 95%)}

    .rail__viewport{
      width:100%;height:336px;position:relative;overflow:hidden;
      mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%);
      -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 82%,transparent 100%);
      transform-style:preserve-3d;
      transform:rotateY(-9deg);
      transform-origin:left center;
    }
    .rail__list{
      position:absolute;left:0;right:0;top:50%;
      transform:translateY(calc(-50% - var(--offset,0px)));
      transition:transform .72s var(--ease2);
      transform-style:preserve-3d;
    }
    .nav-item{
      width:100%;height:112px;
      padding:0 8px 0 clamp(12px,1.6vw,24px);
      display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;
      background:transparent;color:rgba(255,255,255,.20);
      cursor:pointer;text-align:left;
      transform-origin:left center;
      transform:translateZ(-22px) scale(.88);
      opacity:.36;
      transition:
        color .45s ease,opacity .45s ease,transform .68s var(--ease2),
        letter-spacing .68s var(--ease2);
    }
    .nav-item__num{
      font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
      letter-spacing:.12em;color:rgba(255,255,255,.24);
    }
    .nav-item__title{
      font-size:clamp(22px,2.25vw,34px);
      font-weight:540;letter-spacing:-.045em;white-space:nowrap;
    }
    .nav-item__arrow{
      font-size:18px;opacity:0;transform:translate(-8px,8px);
      transition:opacity .3s ease,transform .45s var(--ease2);
    }
    .nav-item.is-near{
      color:rgba(255,255,255,.50);opacity:.72;
      transform:translateZ(0) scale(.94);
    }
    .nav-item.is-active{
      color:#fff;opacity:1;
      transform:translate3d(-10px,0,34px) scale(1.08);
    }
    .nav-item.is-active .nav-item__num{color:var(--accent)}
    .nav-item.is-active .nav-item__arrow{opacity:.72;transform:translate(0,0)}
    .nav-item:focus-visible{outline:1px solid rgba(255,255,255,.35);outline-offset:-8px}

    .rail__progress{
      position:absolute;right:13px;top:50%;transform:translateY(-50%);
      width:1px;height:180px;background:rgba(255,255,255,.08);z-index:5;
    }
    .rail__progress span{
      display:block;width:1px;height:30px;background:rgba(255,255,255,.58);
      transform:translateY(var(--progress,0px));
      transition:transform .72s var(--ease2);
    }
    .rail__counter{
      position:absolute;right:16px;bottom:26px;z-index:6;
      font:650 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:rgba(255,255,255,.28);
    }

    .detail{
      position:fixed;inset:0;z-index:50;
      display:flex;flex-direction:column;
      background:
        radial-gradient(70vw 70vw at 76% 18%,rgba(255,255,255,.045),transparent 60%),
        linear-gradient(145deg,#0d0f12 0%,#07080a 70%);
      opacity:0;
      pointer-events:none;
      clip-path:inset(9% 5% round 34px);
      transform:scale(.985);
      transition:
        opacity .34s ease,
        clip-path .78s var(--ease2),
        transform .78s var(--ease2);
    }
    body.is-detail-open .detail{
      opacity:1;pointer-events:auto;clip-path:inset(0 0 round 0);transform:scale(1);
    }

    .detail__bar{
      height:76px;flex:0 0 76px;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 clamp(20px,3vw,46px);
      border-bottom:1px solid rgba(255,255,255,.08);
      position:relative;z-index:5;
    }
    .detail__back,.detail__next{
      background:transparent;color:rgba(255,255,255,.64);cursor:pointer;
      display:flex;align-items:center;gap:10px;
      font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-transform:uppercase;
    }
    .detail__back:hover,.detail__next:hover{color:#fff}
    .detail__back span,.detail__next span{font-size:15px}
    .detail__count{
      font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:rgba(255,255,255,.34);
    }

    .detail__content{
      flex:1;min-height:0;overflow:auto;
      padding:clamp(34px,5vw,78px) clamp(22px,6vw,92px) clamp(48px,6vw,88px);
    }
    .detail__inner{
      width:min(1220px,100%);min-height:100%;
      margin:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.65fr);
      gap:clamp(42px,7vw,120px);align-items:center;
    }
    .detail__kicker{
      margin:0 0 20px;
      font:650 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    }
    .detail__title{
      margin:0;font-size:clamp(64px,9vw,148px);line-height:.82;letter-spacing:-.075em;font-weight:560;text-wrap:balance;
    }
    .detail__title em{font-family:Georgia,"Times New Roman",serif;font-weight:400;color:rgba(255,255,255,.72)}
    .detail__lead{
      max-width:58ch;margin:28px 0 0;font-size:clamp(15px,1.35vw,19px);line-height:1.65;color:rgba(255,255,255,.55);
    }
    .detail__side{
      align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;
      padding-bottom:clamp(0px,3vh,28px);
    }
    .detail__line{height:1px;background:rgba(255,255,255,.10);margin-bottom:24px}
    .detail__facts{display:grid;gap:0}
    .fact{
      display:grid;grid-template-columns:70px 1fr;gap:12px;
      padding:16px 0;border-bottom:1px solid rgba(255,255,255,.08);
    }
    .fact span{
      font:650 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:rgba(255,255,255,.32);text-transform:uppercase;
    }
    .fact strong{font-size:15px;font-weight:500;line-height:1.45;color:rgba(255,255,255,.78)}
    .detail__ghost{
      position:fixed;right:-1vw;bottom:-8vw;z-index:-1;
      font-size:min(36vw,520px);font-weight:760;line-height:.7;letter-spacing:-.1em;color:rgba(255,255,255,.018);
      user-select:none;
    }

    .detail.is-switching .detail__inner{animation:detailSwitch .48s var(--ease2)}
    @keyframes detailSwitch{
      0%{opacity:.18;transform:translateY(22px)}
      100%{opacity:1;transform:translateY(0)}
    }

    @media(max-width:900px){
      .topbar{padding:16px 16px}
      .topbar__status span:last-child{display:none}
      .selector{padding:58px 10px 12px}
      .shell{
        width:100%;height:calc(100svh - 70px);min-height:0;
        grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 130px;
        border-radius:26px;
      }
      .preview{
        border-right:0;border-bottom:1px solid rgba(255,255,255,.07);
        padding:28px 22px 32px;align-items:flex-end;
      }
      .preview__meta{top:20px;left:22px;right:22px}
      .preview__copy{max-width:92%}
      .preview__title{font-size:clamp(48px,14vw,80px)}
      .preview__summary{font-size:12px;max-width:40ch}
      .preview__open{right:20px;bottom:20px}
      .preview__open span{display:none}
      .rail{padding:0 16px;perspective:none}
      .rail::before,.rail::after{display:none}
      .rail__viewport{
        height:112px;transform:none;mask-image:none;-webkit-mask-image:none;
      }
      .rail__list{
        position:relative;top:0;height:100%;display:flex;align-items:center;gap:8px;
        transform:none!important;overflow-x:auto;scrollbar-width:none;padding:0 6px;
      }
      .rail__list::-webkit-scrollbar{display:none}
      .nav-item{
        flex:0 0 auto;width:auto;height:78px;padding:0 14px;
        grid-template-columns:auto auto;gap:8px;
        transform:none!important;opacity:.38;border-radius:14px;
      }
      .nav-item__arrow{display:none}
      .nav-item__title{font-size:16px}
      .nav-item.is-near{opacity:.62}
      .nav-item.is-active{opacity:1;background:rgba(255,255,255,.055)}
      .rail__progress,.rail__counter{display:none}
      .detail__bar{height:64px;flex-basis:64px;padding:0 16px}
      .detail__inner{
        min-height:auto;display:block;
      }
      .detail__title{font-size:clamp(58px,18vw,98px)}
      .detail__lead{font-size:14px}
      .detail__side{margin-top:54px}
      .detail__content{padding:34px 22px 54px}
      .detail__ghost{font-size:68vw;right:-10vw;bottom:-6vw}
    }

    @media(max-height:690px) and (min-width:901px){
      .shell{height:82svh;min-height:500px}
      .preview__title{font-size:clamp(52px,6.6vw,104px)}
      .rail__viewport{height:300px}
      .nav-item{height:100px}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
      html{scroll-behavior:auto}
      .rail__viewport{transform:none}
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="ARS Portfolio">
      <span class="brand__mark">A</span>
      <span>ARS</span>
    </a>
    <div class="topbar__status">
      <i class="status-dot" aria-hidden="true"></i>
      <span>PORTFOLIO</span>
    </div>
  </header>

  <main>
    <section class="selector" aria-label="Portfolio selector">
      <div class="shell" id="selector-shell">
        <button class="preview" id="preview" type="button" data-index="0" aria-label="Open Intro">
          <span class="preview__visual" aria-hidden="true"></span>
          <span class="preview__meta">
            <span id="preview-count">01 / 06</span>
            <span id="preview-label">INTRO</span>
          </span>
          <span class="preview__copy">
            <span class="preview__eyebrow" id="preview-kicker">Identity / Positioning</span>
            <span class="preview__title" id="preview-title">Build clear things.<br><em>Make them move.</em></span>
            <span class="preview__summary" id="preview-summary">I design and build digital experiences where structure, motion, and systems work as one.</span>
          </span>
          <span class="preview__open"><span>Open chapter</span><i>↗</i></span>
        </button>

        <aside class="rail" aria-label="Portfolio navigation">
          <div class="rail__viewport">
            <nav class="rail__list" id="rail-list">
              <button class="nav-item is-active" type="button" data-index="0">
                <span class="nav-item__num">01</span><span class="nav-item__title">Intro</span><span class="nav-item__arrow">↗</span>
              </button>
              <button class="nav-item is-near" type="button" data-index="1">
                <span class="nav-item__num">02</span><span class="nav-item__title">Work</span><span class="nav-item__arrow">↗</span>
              </button>
              <button class="nav-item" type="button" data-index="2">
                <span class="nav-item__num">03</span><span class="nav-item__title">Process</span><span class="nav-item__arrow">↗</span>
              </button>
              <button class="nav-item" type="button" data-index="3">
                <span class="nav-item__num">04</span><span class="nav-item__title">Capabilities</span><span class="nav-item__arrow">↗</span>
              </button>
              <button class="nav-item" type="button" data-index="4">
                <span class="nav-item__num">05</span><span class="nav-item__title">About</span><span class="nav-item__arrow">↗</span>
              </button>
              <button class="nav-item" type="button" data-index="5">
                <span class="nav-item__num">06</span><span class="nav-item__title">Contact</span><span class="nav-item__arrow">↗</span>
              </button>
            </nav>
          </div>
          <div class="rail__progress" aria-hidden="true"><span id="rail-progress"></span></div>
          <div class="rail__counter" id="rail-counter">01 — 06</div>
        </aside>
      </div>
    </section>

    <section class="detail" id="detail" aria-hidden="true">
      <div class="detail__bar">
        <button class="detail__back" id="detail-back" type="button"><span>←</span> Back</button>
        <span class="detail__count" id="detail-count">01 / 06</span>
        <button class="detail__next" id="detail-next" type="button">Next <span>→</span></button>
      </div>
      <div class="detail__content">
        <div class="detail__inner" id="detail-inner">
          <div>
            <p class="detail__kicker" id="detail-kicker">Identity / Positioning</p>
            <h1 class="detail__title" id="detail-title">Build clear things.<br><em>Make them move.</em></h1>
            <p class="detail__lead" id="detail-lead">I design and build digital experiences where structure, motion, and systems work as one.</p>
          </div>
          <div class="detail__side">
            <div class="detail__line"></div>
            <div class="detail__facts" id="detail-facts"></div>
          </div>
        </div>
      </div>
      <div class="detail__ghost" id="detail-ghost" aria-hidden="true">01</div>
    </section>
  </main>

  <noscript>
    <div style="padding:120px 24px;color:#f2f2ee;max-width:760px;margin:auto">
      <h1>ARS — Portfolio</h1>
      <p>Frontend systems, motion engineering, product thinking, selected work, background, and contact.</p>
    </div>
  </noscript>

  <script>
  (function(){
    var chapters = [
      {
        label:"INTRO",
        nav:"Intro",
        kicker:"Identity / Positioning",
        title:"Build clear things.<br><em>Make them move.</em>",
        summary:"I design and build digital experiences where structure, motion, and systems work as one.",
        facts:[
          ["Focus","Frontend systems"],
          ["Craft","Motion engineering"],
          ["Approach","Clarity before decoration"]
        ]
      },
      {
        label:"SELECTED WORK",
        nav:"Work",
        kicker:"Selected Work / Contribution",
        title:"Proof lives<br><em>in the work.</em>",
        summary:"A focused selection of products, interfaces, and systems—framed around the problem, contribution, and result.",
        facts:[
          ["Layer 01","Context and problem"],
          ["Layer 02","Contribution and decisions"],
          ["Layer 03","Outcome and evidence"]
        ]
      },
      {
        label:"PROCESS",
        nav:"Process",
        kicker:"Thinking / Decisions",
        title:"Show the reason.<br><em>Not only the result.</em>",
        summary:"The work becomes stronger when the decisions, trade-offs, and verification behind it are visible.",
        facts:[
          ["Observe","Find the real constraint"],
          ["Frame","Reduce the problem"],
          ["Build","Make the decision tangible"],
          ["Verify","Check what actually improved"]
        ]
      },
      {
        label:"CAPABILITIES",
        nav:"Capabilities",
        kicker:"Expertise / Applied Skills",
        title:"Systems that<br><em>feel intentional.</em>",
        summary:"Frontend, motion, product thinking, and AI-assisted workflows—grouped by what they help the product achieve.",
        facts:[
          ["Frontend","Structure · responsive · state"],
          ["Motion","Interaction · scroll · choreography"],
          ["Product","Problem · decision · evidence"],
          ["AI","Context · tools · verification"]
        ]
      },
      {
        label:"ABOUT",
        nav:"About",
        kicker:"Background / Direction",
        title:"The path explains<br><em>the pattern.</em>",
        summary:"A practice shaped by building independently, connecting design with engineering, and turning experiments into repeatable systems.",
        facts:[
          ["Practice","Build · test · document"],
          ["Direction","Design + engineering"],
          ["Principle","Useful, clear, alive"]
        ]
      },
      {
        label:"CONTACT",
        nav:"Contact",
        kicker:"Opportunity / Next Step",
        title:"Make something<br><em>worth opening.</em>",
        summary:"Open to thoughtful products, ambitious interfaces, and work that rewards clarity.",
        facts:[
          ["GitHub","github.com/arsafiqri-aybi"],
          ["Availability","Selected collaborations"],
          ["Start","Explore the work, then reach out"]
        ]
      }
    ];

    var preview = document.getElementById("preview");
    var railList = document.getElementById("rail-list");
    var items = Array.prototype.slice.call(document.querySelectorAll(".nav-item"));
    var previewCount = document.getElementById("preview-count");
    var previewLabel = document.getElementById("preview-label");
    var previewKicker = document.getElementById("preview-kicker");
    var previewTitle = document.getElementById("preview-title");
    var previewSummary = document.getElementById("preview-summary");
    var railCounter = document.getElementById("rail-counter");
    var railProgress = document.getElementById("rail-progress");

    var detail = document.getElementById("detail");
    var detailBack = document.getElementById("detail-back");
    var detailNext = document.getElementById("detail-next");
    var detailCount = document.getElementById("detail-count");
    var detailKicker = document.getElementById("detail-kicker");
    var detailTitle = document.getElementById("detail-title");
    var detailLead = document.getElementById("detail-lead");
    var detailFacts = document.getElementById("detail-facts");
    var detailGhost = document.getElementById("detail-ghost");
    var detailInner = document.getElementById("detail-inner");
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
    var mobile = window.matchMedia("(max-width: 900px)");

    var active = 0;
    var wheelLock = false;
    var detailOpen = false;

    function pad(n){ return String(n + 1).padStart(2,"0"); }

    function renderPreview(index){
      var c = chapters[index];
      preview.dataset.index = String(index);
      preview.setAttribute("aria-label","Open " + c.nav);
      previewCount.textContent = pad(index) + " / " + String(chapters.length).padStart(2,"0");
      previewLabel.textContent = c.label;
      previewKicker.textContent = c.kicker;

      previewTitle.style.opacity = "0";
      previewSummary.style.opacity = "0";
      previewTitle.style.transform = "translateY(12px)";
      previewSummary.style.transform = "translateY(8px)";

      window.setTimeout(function(){
        previewTitle.innerHTML = c.title;
        previewSummary.textContent = c.summary;
        previewTitle.style.opacity = "1";
        previewSummary.style.opacity = "1";
        previewTitle.style.transform = "translateY(0)";
        previewSummary.style.transform = "translateY(0)";
      }, reduced.matches ? 0 : 130);
    }

    function setActive(index, ensureMobileVisible){
      index = Math.max(0,Math.min(chapters.length - 1,index));
      active = index;

      items.forEach(function(item,i){
        item.classList.toggle("is-active",i === index);
        item.classList.toggle("is-near",Math.abs(i - index) === 1);
        if(i === index){ item.setAttribute("aria-current","page"); }
        else{ item.removeAttribute("aria-current"); }
      });

      renderPreview(index);
      railCounter.textContent = pad(index) + " — " + String(chapters.length).padStart(2,"0");

      if(!mobile.matches){
        railList.style.setProperty("--offset",(index * 112) + "px");
        railProgress.style.setProperty("--progress",(index * 30) + "px");
      }else if(ensureMobileVisible){
        items[index].scrollIntoView({behavior:reduced.matches ? "auto" : "smooth",block:"nearest",inline:"center"});
      }
    }

    function renderDetail(index){
      var c = chapters[index];
      detailCount.textContent = pad(index) + " / " + String(chapters.length).padStart(2,"0");
      detailKicker.textContent = c.kicker;
      detailTitle.innerHTML = c.title;
      detailLead.textContent = c.summary;
      detailGhost.textContent = pad(index);
      detailFacts.innerHTML = c.facts.map(function(f){
        var value = f[1];
        if(index === 5 && f[0] === "GitHub"){
          value = '<a href="https://github.com/arsafiqri-aybi" target="_blank" rel="noreferrer">' + f[1] + ' ↗</a>';
        }
        return '<div class="fact"><span>' + f[0] + '</span><strong>' + value + '</strong></div>';
      }).join("");
      detailNext.innerHTML = index === chapters.length - 1 ? 'Start <span>↺</span>' : 'Next <span>→</span>';
      detailInner.parentElement.scrollTop = 0;
    }

    function openDetail(index){
      setActive(index,true);
      renderDetail(index);
      detailOpen = true;
      detail.setAttribute("aria-hidden","false");
      document.body.classList.add("is-detail-open");
      window.setTimeout(function(){ detailBack.focus({preventScroll:true}); }, reduced.matches ? 0 : 500);
    }

    function closeDetail(){
      detailOpen = false;
      document.body.classList.remove("is-detail-open");
      detail.setAttribute("aria-hidden","true");
      window.setTimeout(function(){ preview.focus({preventScroll:true}); }, reduced.matches ? 0 : 420);
    }

    function switchDetail(index){
      index = (index + chapters.length) % chapters.length;
      setActive(index,true);
      detail.classList.remove("is-switching");
      void detail.offsetWidth;
      renderDetail(index);
      detail.classList.add("is-switching");
    }

    items.forEach(function(item,i){
      item.addEventListener("click",function(){
        if(i !== active){
          setActive(i,true);
          window.setTimeout(function(){ openDetail(i); }, reduced.matches ? 0 : 220);
        }else{
          openDetail(i);
        }
      });

      item.addEventListener("mouseenter",function(){
        if(!mobile.matches && !detailOpen && i !== active){ setActive(i,false); }
      });
    });

    preview.addEventListener("click",function(){ openDetail(active); });
    detailBack.addEventListener("click",closeDetail);
    detailNext.addEventListener("click",function(){ switchDetail(active + 1); });

    document.getElementById("selector-shell").addEventListener("wheel",function(e){
      if(detailOpen || mobile.matches) return;
      if(Math.abs(e.deltaY) < 8) return;
      e.preventDefault();
      if(wheelLock) return;
      wheelLock = true;
      setActive(active + (e.deltaY > 0 ? 1 : -1),false);
      window.setTimeout(function(){ wheelLock = false; }, reduced.matches ? 60 : 420);
    },{passive:false});

    var touchY = null;
    document.getElementById("selector-shell").addEventListener("touchstart",function(e){
      if(e.touches && e.touches[0]) touchY = e.touches[0].clientY;
    },{passive:true});
    document.getElementById("selector-shell").addEventListener("touchend",function(e){
      if(touchY === null || !e.changedTouches || !e.changedTouches[0]) return;
      var delta = touchY - e.changedTouches[0].clientY;
      touchY = null;
      if(Math.abs(delta) > 45 && !detailOpen && !mobile.matches){
        setActive(active + (delta > 0 ? 1 : -1),false);
      }
    },{passive:true});

    document.addEventListener("keydown",function(e){
      if(e.key === "Escape" && detailOpen){ closeDetail(); return; }
      if(detailOpen){
        if(e.key === "ArrowRight" || e.key === "ArrowDown"){ e.preventDefault(); switchDetail(active + 1); }
        if(e.key === "ArrowLeft" || e.key === "ArrowUp"){ e.preventDefault(); switchDetail(active - 1); }
        return;
      }
      if(e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "PageDown"){
        e.preventDefault();setActive(active + 1,true);
      }
      if(e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp"){
        e.preventDefault();setActive(active - 1,true);
      }
      if(e.key === "Enter" && document.activeElement === preview){ openDetail(active); }
    });

    setActive(0,false);
  })();
  </script>
</body>
</html>
